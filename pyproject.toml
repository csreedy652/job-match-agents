[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-match-agents"
version = "0.1.0"
description = "A multi-agent system that scores a resume against a job description, with a fabrication guardrail"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-match = "job_match.cli:main"

[tool.setuptools]
packages = ["job_match"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
